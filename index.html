<!doctype html>
<html lang="en" class="no-js" style="background:#050507">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050507" />
    <script>
      // Pre-paint (SPEC §9.11): runs before any stylesheet applies.
      //  - no-js → js
      //  - rm when the visitor chose "Reduced" in the footer toggle, or the OS
      //    asks for reduced motion and they have not explicitly chosen "Full"
      //  - data-layout: the mobile rule (keep in sync with MQ.mobile in
      //    src/field/layout.ts and the `mobile` variant in src/index.css)
      //  - data-intro="pending": the §6 intro will probably run (full motion,
      //    home, no ?intro=0 / ?film=, no forced colors; the page always opens
      //    at the top). The scroll cue waits and the HUD reads 1.00 until the
      //    engine runs the intro ("running") or drops the guess; a CSS
      //    failsafe shows the cue after 4 s if nothing ever answers.
      (function () {
        var d = document.documentElement;
        d.className = d.className.replace(/\bno-js\b/, 'js');
        var stored = null;
        try { stored = localStorage.getItem('dtw:motion'); } catch (e) {}
        var osReduce = false;
        try { osReduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (stored === 'reduced' || (stored !== 'full' && osReduce)) d.classList.add('rm');
        var mobile = false;
        try {
          mobile = matchMedia('(max-width: 1023.98px) and (orientation: portrait), (max-width: 767.98px) and (min-height: 500px)').matches;
        } catch (e) {}
        d.setAttribute('data-layout', mobile ? 'mobile' : 'desktop');
        var q = location.search;
        var forced = false;
        try { forced = matchMedia('(forced-colors: active)').matches; } catch (e) {}
        var film = /[?&]film=\s*-?[\d.]/.test(q);
        var introOff = /[?&]intro=(0|false|off)(&|$)/i.test(q);
        if (!d.classList.contains('rm') && !forced && !film && !introOff && location.pathname === '/') {
          d.setAttribute('data-intro', 'pending');
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="Stephen Webb — Senior Product Designer specializing in data-driven products, design systems, and AI-centric experiences. Currently at Tyler Technologies." />
    <meta property="og:title" content="Stephen Webb — Senior Product Designer" />
    <meta property="og:description" content="I design products where data meets decisions. Senior Product Designer at Tyler Technologies." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://designthewebb.com" />
    <meta property="og:image" content="https://designthewebb.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stephen Webb — Senior Product Designer" />
    <meta name="twitter:description" content="I design products where data meets decisions." />
    <title>Stephen Webb — Senior Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent browser from restoring scroll position or scrolling to hash on reload
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      scrollTo(0, 0);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
