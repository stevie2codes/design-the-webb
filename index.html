<!doctype html>
<html lang="en" class="no-js" data-theme="sketch" style="background:#f3eee3">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3eee3" />
    <script>
      // Pre-paint (SPEC §9.11): runs before any stylesheet applies.
      //  - no-js → js
      //  - rm when the visitor chose "Reduced" in the footer toggle, or the OS
      //    asks for reduced motion and they have not explicitly chosen "Full"
      //  - data-theme: "sketch" (paper notebook, the default on this branch) or
      //    "ink" (the dark field), from localStorage['dtw:theme'] (src/theme.ts)
      //  - data-layout: the mobile rule (keep in sync with MQ.mobile in
      //    src/field/layout.ts and the `mobile` variant in src/index.css)
      //  - data-intro="pending": the §6 intro will probably run (full motion,
      //    home, no ?intro=0 / ?film=, no deep-link #hash, no forced colors;
      //    the page always opens at the top). The scroll cue waits and the
      //    HUD reads 1.00 until the engine runs the intro ("running") or drops the guess; a CSS
      //    failsafe shows the cue after 4 s if nothing ever answers.
      (function () {
        var d = document.documentElement;
        d.className = d.className.replace(/\bno-js\b/, 'js');
        var theme = null;
        try { theme = localStorage.getItem('dtw:theme'); } catch (e) {}
        if (theme === 'ink') {
          d.setAttribute('data-theme', 'ink');
          d.style.background = '#050507';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#050507');
          var cs = document.querySelector('meta[name="color-scheme"]');
          if (cs) cs.setAttribute('content', 'dark');
        }
        var stored = null;
        try { stored = localStorage.getItem('dtw:motion'); } catch (e) {}
        var osReduce = false;
        try { osReduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (stored === 'reduced' || (stored !== 'full' && osReduce)) d.classList.add('rm');
        var mobile = false;
        try {
          mobile = matchMedia('(max-width: 1023.98px) and (orientation: portrait), (max-width: 767.98px) and (min-height: 500px)').matches;
        } catch (e) {}
        d.setAttribute('data-layout', mobile ? 'mobile' : 'desktop');
        var q = location.search;
        var forced = false;
        try { forced = matchMedia('(forced-colors: active)').matches; } catch (e) {}
        var film = /[?&]film=\s*-?[\d.]/.test(q);
        var introOff = /[?&]intro=(0|false|off)(&|$)/i.test(q);
        var deepLink = location.hash.length > 1;
        if (!d.classList.contains('rm') && !forced && !film && !introOff && !deepLink && location.pathname === '/') {
          d.setAttribute('data-intro', 'pending');
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      // No browser scroll restoration and no native fragment jump on load:
      // the page opens at the top (the hero paints first). A deep link's
      // hash is kept in window.__dtwHash; the app jumps to it after the
      // first layout refresh and puts it back (src/scroll/initialHash.ts).
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.__dtwHash = location.hash;
      if (location.hash) history.replaceState(history.state, '', location.pathname + location.search);
      scrollTo(0, 0);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
